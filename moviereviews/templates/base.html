<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Movie Reviews</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
          crossorigin="anonymous">

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body class="bg-light">

    <nav class="navbar navbar-expand-lg bg-body-tertiary shadow-sm py-3">
        <div class="container-fluid px-4">

            <a class="navbar-brand" href="{% url 'home' %}">
                Movies
            </a>

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent"
                    aria-controls="navbarSupportedContent"
                    aria-expanded="false"
                    aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse"
                 id="navbarSupportedContent">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active"
                           aria-current="page"
                           href="{% url 'news' %}">
                            News
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="#">
                            Login
                        </a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link"
                           href="#">
                            Sign Up
                        </a>
                    </li>

                </ul>

            </div>

        </div>
    </nav>

    <div class="container mt-5 mb-5">

        {% block content %}
        {% endblock content %}

    </div>

    <footer class="text-center text-lg-start bg-white border-top text-muted mt-5">
        <div class="container py-4">
            <div class="row">
                <div class="col-12 text-center">
                    <h4 class="h6 mb-0">© 2025 Copyright - Paola Vallejo & Juan David Martínez</h4>
                </div>
            </div>
        </div>
    </footer>

</body>
</html>
