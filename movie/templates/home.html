<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movies App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body class="bg-light">
    <div class="container py-5">
        <form action="" class="card shadow-sm p-4 mb-4">
            <div class="mb-3">
                <label for="searchMovie" class="form-label fw-semibold">
                    Search for Movie:
                </label>
                <input type="text" class="form-control mb-3" name="searchMovie" id="searchMovie" />
            </div>
            <button type="submit" class="btn btn-primary">Search</button>
        </form>

        <p class="mb-4">Searching for {{ searchTerm }}</p>

        <div class="row row-cols-1 row-cols-md-3 g-4">
            {% for movie in movies %}
                <div class="col">
                    <div class="card h-100">
                        <img src="{{ movie.image.url }}" class="card-img-top" alt="{{ movie.title }}">
                        <div class="card-body">
                            <h5 class="card-title">{{ movie.title }}</h5>
                            
                            <!-- Atributos agregados: Genre y Year -->
                            {% if movie.genre %}
                                <p class="card-text mb-1"><strong>Genre:</strong> {{ movie.genre }}</p>
                            {% endif %}
                            {% if movie.year %}
                                <p class="card-text mb-2"><strong>Year:</strong> {{ movie.year }}</p>
                            {% endif %}

                            <p class="card-text">{{ movie.description }}</p>

                            {% if movie.url %}
                                <a href="{{ movie.url }}" class="btn btn-primary">Movie Link</a>
                            {% endif %}
                        </div>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</body>
</html>
